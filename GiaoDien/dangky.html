<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --text: #111827;
            --error: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            min-height: 100vh;
            margin: 0;
        }
        .register-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        .form-group.full { grid-column: span 2; }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        input[type="text"], 
        input[type="password"], 
        input[type="email"], 
        input[type="date"], 
        select, 
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        
        .radio-group {
            display: flex;
            gap: 1.5rem;
            padding: 0.75rem 0;
        }
        .radio-item { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
        
        textarea { resize: none; background: #f9fafb; font-size: 0.875rem; }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            font-size: 0.875rem;
        }
        
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 2rem;
            font-size: 1rem;
        }
        button:hover { background: var(--primary-hover); }
        
        .message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
        }
        .message.error { background: #fee2e2; color: var(--error); display: block; white-space: pre-line; }
        .message.success { background: #ecfdf5; color: var(--success); display: block; text-align: center; }

        .link-login {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }
        .link-login a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="register-card">
        <h1>Đăng Ký Tài Khoản</h1>
        
        <div id="formDangKy">
            <div class="grid">
                <div class="form-group">
                    <label for="ho">Họ</label>
                    <input type="text" id="ho" placeholder="Nguyễn">
                </div>
                <div class="form-group">
                    <label for="ten">Tên</label>
                    <input type="text" id="ten" placeholder="Văn A">
                </div>
                <div class="form-group">
                    <label for="tenDangNhap">Tên đăng nhập</label>
                    <input type="text" id="tenDangNhap" placeholder="username">
                </div>
                <div class="form-group">
                    <label for="matKhau">Mật khẩu</label>
                    <input type="password" id="matKhau" placeholder="••••••••">
                </div>
                <div class="form-group full">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com">
                </div>
                <div class="form-group">
                    <label for="ngaySinh">Ngày sinh</label>
                    <input type="date" id="ngaySinh">
                </div>
                <div class="form-group">
                    <label>Giới tính</label>
                    <div class="radio-group">
                        <label class="radio-item"><input type="radio" name="gioiTinh" value="Nam" checked> Nam</label>
                        <label class="radio-item"><input type="radio" name="gioiTinh" value="Nữ"> Nữ</label>
                    </div>
                </div>
                <div class="form-group full">
                    <label for="queQuan">Quê quán</label>
                    <select id="queQuan">
                        <option value="">-- Chọn tỉnh/thành phố --</option>
                        <option value="Hà Nội">Hà Nội</option>
                        <option value="Huế">Huế</option>
                        <option value="Tp.HCM">Tp.HCM</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label>Điều khoản sử dụng</label>
                    <textarea rows="3" readonly>1. Bạn phải cam kết cung cấp thông tin chính xác.
2. Không sử dụng ứng dụng cho mục đích xấu.
3. Chúng tôi bảo mật thông tin cá nhân của bạn.</textarea>
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="dongY">
                <label for="dongY">Tôi đồng ý với điều khoản sử dụng</label>
            </div>

            <button id="btnDangKy">Đăng ký</button>
            
            <div id="thongBao" class="message"></div>

            <div class="link-login">
                Đã có tài khoản? <a href="index.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btnDangKy').addEventListener('click', async () => {
            const duLieu = {
                ho: document.getElementById('ho').value,
                ten: document.getElementById('ten').value,
                tenDangNhap: document.getElementById('tenDangNhap').value,
                matKhau: document.getElementById('matKhau').value,
                email: document.getElementById('email').value,
                ngaySinh: document.getElementById('ngaySinh').value,
                gioiTinh: document.querySelector('input[name="gioiTinh"]:checked').value,
                queQuan: document.getElementById('queQuan').value,
                dongY: document.getElementById('dongY').checked
            };

            const thongBao = document.getElementById('thongBao');
            thongBao.className = 'message';
            thongBao.innerText = '';

            try {
                const phanHoi = await fetch('/api/taikhoan/dang-ky', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(duLieu)
                });

                const ketQua = await phanHoi.json();

                if (phanHoi.ok) {
                    thongBao.classList.add('success');
                    thongBao.innerText = ketQua.thongBao;
                } else {
                    thongBao.classList.add('error');
                    thongBao.innerText = ketQua.thongBao;
                }
            } catch (loi) {
                thongBao.classList.add('error');
                thongBao.innerText = "Lỗi kết nối server!";
            }
        });
    </script>
</body>
</html>
