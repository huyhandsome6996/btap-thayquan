<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f3f4f6;
            --text: #111827;
            --error: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 0.5rem;
            text-align: center;
        }
        p.subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.875rem;
        }
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        button {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        button:hover { background: var(--primary-hover); }
        .message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            display: none;
            text-align: center;
        }
        .message.error { background: #fee2e2; color: var(--error); display: block; }
        .message.success { background: #ecfdf5; color: var(--success); display: block; }
        .link-register {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
        }
        .link-register a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Đăng Nhập</h1>
        <p class="subtitle">Vui lòng nhập thông tin tài khoản</p>
        
        <div class="form-group">
            <label for="tenDangNhap">Tên đăng nhập</label>
            <input type="text" id="tenDangNhap" placeholder="Ví dụ: admin">
        </div>
        
        <div class="form-group">
            <label for="matKhau">Mật khẩu</label>
            <input type="password" id="matKhau" placeholder="••••••••">
        </div>
        
        <button id="btnLogIn">Log In</button>
        
        <div id="thongBao" class="message"></div>

        <div class="link-register">
            Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        document.getElementById('btnLogIn').addEventListener('click', async () => {
            const tenDangNhap = document.getElementById('tenDangNhap').value;
            const matKhau = document.getElementById('matKhau').value;
            const thongBao = document.getElementById('thongBao');

            // Xóa sạch mấy cái thông báo cũ đi cho đỡ chật chỗ trước khi kiểm tra cái mới
            thongBao.className = 'message';
            thongBao.innerText = '';

            try {
                const phanHoi = await fetch('/api/taikhoan/dang-nhap', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tenDangNhap, matKhau })
                });

                const ketQua = await phanHoi.json();

                if (phanHoi.ok) {
                    thongBao.classList.add('success');
                    thongBao.innerText = ketQua.thongBao;
                } else {
                    thongBao.classList.add('error');
                    thongBao.innerText = ketQua.thongBao;
                }
            } catch (loi) {
                thongBao.classList.add('error');
                thongBao.innerText = "Lỗi kết nối server!";
            }
        });
    </script>
</body>
</html>
